name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format cppcheck

      - name: Lint src (check only)
        run: ./scripts/lint.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config g++ \
            libgtkmm-3.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Meson compile
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
